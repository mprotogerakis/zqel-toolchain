name: Check toolchains

# JEDER Zweig, nicht nur main.
#
# forgejo ist hier ein PULL-Spiegel von GitHub. Der Zweig kommt an, das
# pull_request-EREIGNIS aber nicht - Pull Requests entstehen auf GitHub, und
# dort sind Actions abgeschaltet. Mit `branches: [main]` lief deshalb ueber-
# haupt kein Gate VOR einem Merge; geprueft wurde erst, was schon drin war.
# Gemessen am 2026-09-14: der Zweig macos-ca-vertrauen lag im Spiegel, und
# `status` meldete "no runs found".
#
# pull_request bleibt stehen: es traegt nichts, solange gespiegelt wird, ist
# aber richtig, sobald jemand einen PR direkt in forgejo aufmacht.
on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  creusot-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout without an external action
        run: |
          set -eu
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format="checked out: %H %s"

      - name: Install Nix
        run: bash scripts/ci_install_nix.sh

      - name: Confirm runner architecture
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = x86_64-linux

      - name: Build and smoke-test the complete Creusot closure
        run: |
          set -eu
          exec </dev/null
          # Die Dauer wird GEMESSEN und genannt, wie in den Windows-Fahrten.
          #
          # Warum das hier steht: am 2026-09-15 fiel auf, dass dieser Job -
          # `timeout-minutes: 90`, vollstaendige Creusot-Schliessung - in 10
          # bis 30 Sekunden fertig ist. Der Log erklaert es (kein einziges
          # `building '/nix/store/...'`: der Store des Runners ist warm), aber
          # das musste jemand nachlesen. Ein Gate, dessen normale Dauer
          # niemand kennt, faellt nicht auf, wenn es sie verliert - weder
          # nach oben noch nach unten.
          start=$SECONDS
          nix build -L .#checks.x86_64-linux.creusot-smoke
          # matiec gehoert seit dem 2026-09-14 dazu. Ohne diese Zeile stuende
          # es zwar in der Flake, wuerde aber von nichts gebaut - und ein
          # Paket, das niemand baut, ist irgendwann kaputt, ohne dass es
          # auffaellt.
          nix build -L .#checks.x86_64-linux.matiec-smoke
          echo "  Dauer_s: $((SECONDS - start))"
          echo "  (Sekunden statt Minuten heisst: der Store war warm und nix"
          echo "   hat nur ausgewertet. Ein kalter Runner braucht hier"
          echo "   Groessenordnungen mehr - dafuer steht die 90-Minuten-Grenze.)"

      - name: The content-addressed flake evaluates outside the checkout
        run: |
          set -eu
          artifact=$(python3 tools/pack_flake.py --out dist --print-name)
          nix flake metadata --json "tarball+file://$PWD/dist/$artifact" > /dev/null

  # Die Download-Tabelle in der README gegen die Pins.
  #
  # ABSICHTLICH ein eigener, kurzer Job ohne nix: er braucht nur Python und
  # eine Leitung nach draussen, laeuft in Sekunden und bleibt gruen, wenn der
  # lange Creusot-Bau faellt. Umgekehrt soll eine vergessene Zeile in der
  # Tabelle nicht 90 Minuten warten muessen, um aufzufallen.
  #
  # Geprueft wird die MENGE der zugesagten Adressen, nicht ihre Groesse -
  # Groessen aendern sich rechtmaessig, und eine CI, die deshalb rot wird,
  # bringt man allen nur bei zu ignorieren.
  downloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without an external action
        run: |
          set -eu
          exec </dev/null
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c protocol.version=2 fetch -q --depth 1 origin "$GITHUB_SHA"
          git --no-pager -c core.pager=cat checkout -q FETCH_HEAD
          echo "  ausgecheckt: $(git --no-pager log -1 --format=%h%x20%s)"

      - name: Nennt die README jede Adresse, die aus den Pins folgt?
        run: |
          set -eu
          exec </dev/null
          python3 tools/write_download_table.py --pruefen

      # Dieselbe Frage fuer winget (#19), nur andersherum: das Manifest nennt
      # eine Adresse und einen Hash, die auf FREMDEN Rechnern ausgefuehrt
      # werden. Geprueft wird deshalb gegen das, was oeffentlich wirklich
      # liegt - die .sha256-Beilage neben dem Installer -, nicht gegen eine
      # gepflegte Zahl im Manifest.
      - name: Sagen die winget-Manifeste, was oeffentlich ausgeliefert wird?
        run: |
          set -eu
          exec </dev/null
          python3 tools/windows/write_winget_manifest.py --pin gappa-pin.json --pruefen
          python3 tools/windows/write_winget_manifest.py --pin matiec-pin.json --pruefen

  # Die Tests. Bis zum 2026-09-15 fuhr sie KEINE Fahrt.
  #
  # Neun Dateien, 120 Tests, und `grep -rn pytest .forgejo` fand nichts. Was
  # dabei herauskommt, stand messbar im Baum: test_toolchain_lock.py war auf
  # main rot (#21), seit irgendwann, und niemand hat es gemerkt. Eine Datei
  # unter tests/ ohne eine Fahrt, die sie ruft, ist Dokumentation mit
  # Verfallsdatum - und dieses Repository haelt an mehreren Stellen fest,
  # dass etwas, das niemand baut, irgendwann kaputt ist, ohne aufzufallen.
  #
  # EIGENER JOB, nicht ein Schritt bei den downloads: die pruefen eine
  # Zusage nach draussen, diese hier pruefen den Baum. Ein Job, der bei
  # beidem rot wird, sagt nicht mehr, welches von beidem kaputt ist.
  #
  # Gemessen: 0,3 Sekunden fuer alles. Ganz ohne Leitung nach draussen geht
  # es NICHT - test_the_lock_still_matches_the_pins ruft sammle(), und das
  # holt latest.json (eine Anfrage, 0,11 s). Der Job gehoert damit zu den
  # kurzen neben downloads, nicht vor den nix-Bau; und wenn dl.zqel.org
  # schweigt, ist er rot. Das ist die Zusage dieser Datei, also richtig so.
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout without an external action
        run: |
          set -eu
          exec </dev/null
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git -c protocol.version=2 fetch -q --depth 1 origin "$GITHUB_SHA"
          git --no-pager -c core.pager=cat checkout -q FETCH_HEAD
          echo "  ausgecheckt: $(git --no-pager log -1 --format=%h%x20%s)"

      - name: pytest
        run: |
          set -eu
          exec </dev/null
          if ! python3 -m pytest --version >/dev/null 2>&1; then
            # Neuere Abbilder markieren ihr Python als "externally managed"
            # (PEP 668) und weisen pip ohne dieses Flag ab. Erst der normale
            # Weg, dann der, den das Abbild erzwingt - und wenn beides
            # scheitert, faellt der Job, statt die Tests zu ueberspringen.
            pip3 install --quiet pytest \
              || pip3 install --quiet --break-system-packages pytest
          fi
          python3 -m pytest tests -q
