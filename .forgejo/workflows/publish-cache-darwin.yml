# Die Darwin-Haelfte des Binaercaches - von einem Mac, der nur kurz da ist.
#
# WARUM ES DIESEN EIGENEN WORKFLOW GIBT:
# Die eine Maschine, die aarch64-darwin bauen kann, hatte bisher keine
# R2-Zugaenge; die eine Stelle mit den Zugaengen hat keinen macOS-Runner. Ein
# Runner, der sich auf dem Laptop kurz anmeldet, loest beides, OHNE die Regel
# aufzuweichen: die Geheimnisse kommen weiterhin aus forgejo, landen nur fuer
# die Dauer des Laufs auf der Maschine und sind danach weg. Ein Laptop mit
# stehenden Zugaengen waere der schlechtere Tausch.
#
# NUR AUF ZURUF. Kein `push`, kein `schedule`, niemals `pull_request`:
# - Ein Host-Runner fuehrt den Job OHNE Container aus, also mit den Rechten
#   des Benutzers, der ihn gestartet hat.
# - Der Runner ist nur zeitweise da; ein automatischer Ausloeser liefe ins
#   Leere und saehe aus wie ein Ausfall.
#
# WIE MAN DEN RUNNER ANSCHLIESST: scripts/attach_macos_runner.sh
name: Publish the Darwin binary cache

on:
  workflow_dispatch:

jobs:
  darwin-cache:
    runs-on: macos-arm64
    # Grosszuegig, weil ein KALTER Store die Beweiser erst uebersetzt. Auf
    # einer Maschine, die creusot-free schon gebaut hat, sind es Minuten.
    timeout-minutes: 360
    steps:
      # MUSS VOR DEM CHECKOUT STEHEN.
      #
      # Die Instanz traegt ein Zertifikat aus einer eigenen CA. macOS vertraut
      # ihr (curl antwortet mit 200), aber git aus nixpkgs bringt sein eigenes
      # Buendel mit - und NIX_SSL_CERT_FILE zeigte dabei auf
      # /etc/ssl/certs/ca-certificates.crt, einen LINUX-Pfad, den es auf macOS
      # nicht gibt. Der erste Lauf starb deshalb mit
      #   "self-signed certificate in certificate chain (19)"
      # und danach mit "No such file or directory" - das git hatte gar kein
      # Buendel.
      #
      # WOHER DAS ZERTIFIKAT KOMMT, IST DER PUNKT:
      # Der NAME der CA wird aus dem Zertifikat des Servers abgelesen, das
      # ZERTIFIKAT selbst aber aus dem Schluesselbund DIESER MASCHINE geholt.
      # Die Kette zu nehmen, die der Server anbietet, waere zirkulaer - dann
      # bestaetigte er sich selbst. So wird nur akzeptiert, was der Rechner
      # ohnehin schon als vertrauenswuerdig fuehrt.
      - name: Trust the instance CA the way this machine already does
        run: |
          set -eu
          wirt=$(printf '%s' "$GITHUB_SERVER_URL" | sed -e 's|^https://||' -e 's|/.*||')
          aussteller=$(openssl s_client -connect "$wirt:443" -servername "$wirt" \
            </dev/null 2>/dev/null | openssl x509 -noout -issuer \
            | sed -n 's/.*CN *= *\([^,/]*\).*/\1/p')
          if [ -z "$aussteller" ]; then
            echo "Der Aussteller von $wirt liess sich nicht ablesen."; exit 1
          fi
          echo "  Aussteller laut Server: $aussteller"

          buendel="$(mktemp -d)/ca-bundle.pem"
          cat /etc/ssl/cert.pem > "$buendel"
          security find-certificate -a -c "$aussteller" -p >> "$buendel" 2>/dev/null || true
          anzahl=$(grep -c 'BEGIN CERTIFICATE' "$buendel")
          echo "  Buendel: $anzahl Zertifikate"

          # Die Gegenprobe: taugt es fuer genau diesen Server? Ohne sie faellt
          # der Fehler erst im Checkout auf, und dort sieht er aus wie ein
          # Netzproblem.
          if ! GIT_SSL_CAINFO="$buendel" git ls-remote \
               "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Das Buendel reicht fuer $wirt nicht."
            echo "Liegt '$aussteller' im Schluesselbund dieser Maschine?"
            exit 1
          fi
          echo "  git spricht mit $wirt"
          echo "GIT_SSL_CAINFO=$buendel" >> "$GITHUB_ENV"
          echo "NIX_SSL_CERT_FILE=$buendel" >> "$GITHUB_ENV"
          echo "SSL_CERT_FILE=$buendel" >> "$GITHUB_ENV"

      - name: Checkout without an external action
        run: |
          set -eu
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format="checked out: %H %s"

      # Auf einem Host-Runner wird NICHTS installiert. nix gehoert der
      # Maschine, nicht diesem Lauf. Wenn es fehlt, soll das hier stehen und
      # nicht drei Schritte spaeter als unverstaendlicher Fehler.
      - name: Find the machine's own nix
        run: |
          set -eu
          if ! command -v nix >/dev/null; then
            # Die Mehrbenutzer-Installation liegt nicht in jedem PATH.
            profil=/nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
            if [ -r "$profil" ]; then
              # shellcheck disable=SC1090
              . "$profil"
              echo "PATH=$PATH" >> "$GITHUB_ENV"
            fi
          fi
          command -v nix || {
            echo "Auf dieser Maschine ist kein nix erreichbar."
            echo "Der Runner laeuft als: $(id -un)"
            echo "Genau dieses Konto muss nix sehen - nicht dein Terminal."
            exit 1
          }
          nix --version
          echo "System: $(nix eval --impure --raw --expr 'builtins.currentSystem')"

      - name: Build and smoke-test before publication
        run: nix build -L .#checks.aarch64-darwin.creusot-smoke

      - name: Fill the signed binary cache
        env:
          NIX_SIGNING_KEY: ${{ secrets.NIX_SIGNING_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ID: ${{ secrets.R2_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
        run: |
          set -eu
          if [ -z "${NIX_SIGNING_KEY:-}" ]; then
            echo "NIX_SIGNING_KEY ist nicht gesetzt - der Cache bliebe leer."
            exit 1
          fi
          # Der Schluessel darf nur als Datei existieren, nur fuer uns, und
          # nur so lange wie noetig. RUNNER_TEMP gibt es auf einem Host-Runner
          # nicht immer - deshalb ein eigenes Verzeichnis.
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT INT TERM
          printf '%s' "$NIX_SIGNING_KEY" > "$tmp/nix-cache.key"
          python3 tools/publish_nix_cache.py \
            --key "$tmp/nix-cache.key" \
            .#packages.aarch64-darwin.creusot-free

      - name: Verify the cache answers as an outsider
        run: python3 tools/verify_nix_cache.py .#packages.aarch64-darwin.creusot-free
