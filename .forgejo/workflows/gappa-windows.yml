# Das Windows-gappa: bauen, paketieren, veroeffentlichen.
#
# WARUM WOECHENTLICH UND NICHT TAEGLICH:
# Der Pin bewegt sich nicht von allein (gappa-pin.json), also waere ein
# taeglicher Lauf taeglich dasselbe Artefakt. Was sich bewegt, ist die
# Baumaschine: MSYS2 aktualisiert gcc, boost, gmp und mpfr laufend. Ein
# woechentlicher Lauf misst genau das - ob unsere Bauanleitung auf einer
# fortgeschriebenen Toolchain noch traegt. Das ist der Ertrag, nicht das Zip.
#
# WARUM ER DEN PIN NICHT ANHEBT:
# Gappa ist ein Beweiswerkzeug; seine Version steht in der Beweiskette. Der
# Lauf FRAGT Upstream und meldet Abstand. Er entscheidet nicht.
# Umgezogen aus mprotogerakis/LoLa am 2026-09-14.
name: gappa-windows

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  gappa-win-amd64:
    runs-on: windows-amd64
    timeout-minutes: 90
    steps:
      - name: Auschecken ohne externe Action
        shell: pwsh
        run: |
          # Wie im Nightly: `actions/checkout` liegt auf code.forgejo.org und
          # dieser Runner kommt dort nicht heran (gemessen 2026-09-13).
          git init -q .
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY"
          git fetch -q --depth 1 origin $env:GITHUB_SHA
          git checkout -q FETCH_HEAD
          git log -1 --format="ausgecheckt: %H %s"

      - name: Die Maschine hat, was die Manifeste verlangen
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools/windows/provision.ps1 -VerifyOnly

      - name: Bauen, pruefen, paketieren
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          powershell -ExecutionPolicy Bypass -File tools/windows/build_gappa.ps1 -Out dist\gappa
          if ($LASTEXITCODE -ne 0) { throw "build_gappa exit $LASTEXITCODE" }
          $sw.Stop()
          "Dauer_min: " + [math]::Round($sw.Elapsed.TotalMinutes, 1)
          # Dasselbe Stage-Verzeichnis noch einmal als .nupkg - in ein EIGENES
          # Ausgabeverzeichnis, weil die Schritte darunter alles aus
          # dist\gappa hochladen. Ein .nupkg in der generischen Registry und
          # auf R2 waere ein zweites Zip mit fremdem Namen; ein Paket wird es
          # erst am NuGet-Endpunkt.
          python tools\windows\pack_nupkg.py --pin gappa-pin.json `
            --stage dist\gappa\stage --out dist\gappa-nuget
          if ($LASTEXITCODE -ne 0) { throw "pack_nupkg exit $LASTEXITCODE" }
          # Und dasselbe noch einmal fuer Chocolatey (#20). Kein zweites
          # Skript: der Unterschied sind Metadaten und zwei Dateien fuer die
          # Moderation - das Paket ist dasselbe Verzeichnis.
          python tools\windows\pack_nupkg.py --pin gappa-pin.json --art choco `
            --stage dist\gappa\stage --out dist\gappa-choco
          if ($LASTEXITCODE -ne 0) { throw "pack_nupkg --art choco exit $LASTEXITCODE" }
          $v = (Get-Content gappa-pin.json -Raw | ConvertFrom-Json).version
          "GAPPA_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Was gebaut wurde
        shell: pwsh
        run: |
          Get-Content "dist\gappa\stage\PIN.txt"
          Get-ChildItem dist\gappa\* -File |
            Select-Object Name, @{n="MB"; e={[math]::Round($_.Length/1MB, 2)}} | Format-Table -AutoSize

      - name: Abstand zu Upstream
        shell: pwsh
        continue-on-error: true
        run: |
          # Ein Befund, kein Gate. Wenn Upstream weiter ist, soll das im Log
          # stehen und jemand entscheiden - nicht dieser Lauf.
          $pin = Get-Content gappa-pin.json -Raw | ConvertFrom-Json
          try {
            $tags = Invoke-RestMethod -UseBasicParsing -Uri `
              "https://gitlab.inria.fr/api/v4/projects/gappa%2Fgappa/repository/tags?per_page=1"
          } catch {
            Write-Output "Upstream nicht erreichbar: $($_.Exception.Message)"
            exit 0
          }
          $latest = $tags[0].name
          Write-Output "gepinnt:  $($pin.upstream_tag)"
          # ([datetime]) statt .Substring: `Invoke-RestMethod` unter pwsh 7
          # macht aus einem ISO-8601-String ein [DateTime], und das hat kein
          # Substring. Der Schritt ist `continue-on-error`, also war der
          # Absturz nicht rot - er hat nur nichts mehr gemeldet. Ein Melder,
          # der still ausfaellt, ist schlimmer als keiner: der woechentliche
          # Lauf ist genau dafuer da, Drift zu MELDEN.
          # Der Cast traegt beide Faelle, String wie DateTime.
          $wann = ([datetime]$tags[0].commit.created_at).ToString("yyyy-MM-dd")
          Write-Output "upstream: $latest ($wann)"
          if ($latest -ne $pin.upstream_tag) {
            Write-Output "::warning::Upstream ist bei $latest, der Pin bei $($pin.upstream_tag). Eine Prover-Version aendert Verdikte - erst die devShell heben, dann den Pin."
          } else {
            Write-Output "gleichauf."
          }

      - name: In die NuGet-Registry
        # WARUM PAKETREGISTRY UND NICHT RELEASE (entschieden 2026-09-13):
        # Ein Release legt einen git-Tag im Repo an - fremdes Werkzeug in
        # unserer Historie - und braucht ein Token mit Repo-Schreibrecht.
        # PACKAGE_TOKEN darf nur `package`; gemessen am 2026-09-13 antwortet
        # ihm die Releases-API mit 403, der Paket-Upload mit 201. Weniger
        # Rechte fuer dieselbe Aufgabe.
        #
        # WARUM HIER KEINE ZWEITE KOPIE DER DATEIEN MEHR LIEGT (2026-09-15):
        # Bis heute lud dieser Job Zip, Installer, Quelle und die
        # sha256-Beilagen zusaetzlich in die GENERISCHE Registry. Das war
        # eine zweite Wahrheit neben dl.zqel.org - und sie ist auseinander-
        # gelaufen: die Registry verbucht einen zweiten Upload als 409 und
        # behaelt die erste Fassung, R2 ueberschrieb still. Nach zwei Laeufen
        # lieferten beide unter demselben Namen verschiedene Dateien aus
        # (#33). Eine Zusage, zwei Adressen, zwei Antworten.
        #
        # R2 ist die Wahrheit - dorthin zeigt die oeffentliche Doku, und seit
        # #33 bleibt dort liegen, was einmal liegt. Die Registry traegt nur
        # noch das, was R2 NICHT kann: einen Feed, aus dem ein Werkzeug
        # aufloest.
        # Ein .nupkg unter einer generischen Adresse ist eine Datei zum
        # Herunterladen - dafuer gibt es das Zip laengst. Erst der
        # NuGet-Endpunkt macht daraus eine QUELLE, aus der eine Kette
        # `Zqel.Gappa.win-x64 1.4.0` aufloest und diese Angabe festhalten
        # kann. Das ist der ganze Ertrag dieses Schritts.
        #
        # NICHT nach R2, aus demselben Grund umgekehrt: eine einzelne Datei
        # ohne index.json ist kein Feed. Ein oeffentlicher NuGet-Dienst waere
        # eine eigene Entscheidung, nicht ein Nebeneffekt hiervon.
        #
        # `-Form` gibt es erst ab PowerShell 6; diese Schritte laufen unter
        # pwsh (7), die Bauskripte unter Windows PowerShell 5.1. Deshalb steht
        # der Upload hier und nicht im Bauskript.
        #
        # GEMESSEN am 2026-09-15 (Jobs 3831 und 3500, win-nuitka-01): der
        # Endpunkt nimmt multipart an und antwortet mit "neu". Danach von
        # aussen gegengeprueft - die Registry fuehrt Zqel.Gappa.win-x64 1.4.0,
        # `registration/.../index.json` loest auf, und das zurueckgeholte
        # Paket traegt gappa.exe (18012024 Bytes), sieben Lizenztexte,
        # NOTICE.txt, SOURCES.txt, PIN.txt und den Quell-Tarball, dessen
        # sha256 dem Pin entspricht (6bf17688..., 387988 Bytes). Vorher war
        # das hier eine Protokollbeschreibung, keine Messung.
        shell: pwsh
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          # KEINE Bedingung am Schritt - der Zweck bleibt, nur wird er
          # sichtbar. Bis zum 2026-09-15 stand das Urteil im Schritt davor
          # ("In die Paketregistry"), der mit #33 entfallen ist; ohne diese
          # Zeilen waere daraus ein stilles Ueberspringen geworden - ein Lauf,
          # der gruen durchlaeuft und nichts veroeffentlicht. Auf main ist das
          # kein zulaessiger Fall, sondern ein Fehler.
          if (-not $env:PACKAGE_TOKEN) {
            Write-Host "PACKAGE_TOKEN ist nicht gesetzt - es wurde NICHTS veroeffentlicht."
            $zweig = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME } else { "main" }
            if ($zweig -eq "main") {
              Write-Host "Auf main ist das ein Fehler, kein zulaessiger Fall."
              exit 1
            }
            Write-Host "Auf '$zweig' ist das zulaessig - hier wird nicht veroeffentlicht."
            exit 0
          }
          $nupkg = Get-ChildItem dist\gappa-nuget\*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "kein .nupkg in dist\gappa-nuget" }
          $uri = "https://git.ei.intern.hs-duesseldorf.de/api/packages/proto/nuget"
          $h = @{ Authorization = "token $env:PACKAGE_TOKEN"; "X-NuGet-ApiKey" = $env:PACKAGE_TOKEN }
          try {
            Invoke-WebRequest -Uri $uri -Method Put -Headers $h `
              -Form @{ package = $nupkg } -UseBasicParsing | Out-Null
            Write-Output "  neu:          $($nupkg.Name)"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            if ($code -eq 409) {
              # Wie beim Zip: derselbe Pin baut dasselbe Paket. Eine
              # woechentliche Neuveroeffentlichung behauptete eine Aenderung,
              # die es nicht gibt.
              Write-Output "  unveraendert: $($nupkg.Name) (schon veroeffentlicht)"
            } else {
              throw "NuGet-Upload $($nupkg.Name): HTTP $code"
            }
          }
          Write-Output "$uri/index.json"

      # Nach dl.zqel.org - dem OEFFENTLICHEN Ablageort.
      #
      # Die forgejo-Registry loest auf 10.30.38.20 auf (gemessen 2026-09-13),
      # ist also nur im HSD-Netz erreichbar. Ein Link aus der oeffentlichen
      # Doku dorthin waere fuer jeden draussen tot. Deshalb beides: Registry
      # intern, R2 oeffentlich.
      #
      # KORREKTUR vom 2026-09-14: hier stand, gespiegelte Fremdartefakte
      # gingen NICHT nach R2. Das war falsch - mirror-tools.yml legt sie seit
      # jeher unter tools/<werkzeug>/<version>/ ab, und alle 13 antworten dort
      # (gemessen, tools/write_download_table.py). Der Satz beschrieb eine
      # Absicht, nicht den Bestand.
      - name: Nach dl.zqel.org
      # KEINE Bedingung auf die Zugaenge - mit Absicht.
      #
      # Hier stand `if: ${{ env.R2_ID != '' }}`. Das machte aus einem lauten
      # Fehlschlag ein stilles Ueberspringen: fehlten die Geheimnisse, lief
      # der Job gruen durch und veroeffentlichte nichts. Genau die fail-open
      # Stufe aus #210, nur an der Auslieferung statt an einem Verdikt.
      #
      # tools/publish_r2.py faellt selbst geschlossen aus - Exit 1 mit einem
      # Satz, gemessen. Ein Lauf ohne Zugaenge SOLL rot sein.
        shell: pwsh
        env:
          R2_ID: ${{ secrets.R2_ID }}
          R2_SECRET: ${{ secrets.R2_SECRET }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          $f = (Get-ChildItem dist\gappa\* -File | ForEach-Object { $_.FullName })
          python tools\publish_r2.py --prefix "tools/gappa/$env:GAPPA_VERSION" @f
          if ($LASTEXITCODE -ne 0) { throw "publish_r2 exit $LASTEXITCODE" }

      # GANZ ZUM SCHLUSS, und das ist der Grund:
      # Alles darueber ist unsere eigene Auslieferung - die Registry
      # im Haus und dl.zqel.org. Chocolatey ist ein fremder Dienst.
      # Stuende dieser Schritt davor, haette eine Panne dort unsere
      # oeffentliche Auslieferung verhindert: ein Werkzeug, das
      # niemand herunterladen kann, weil ein Dritter 500 sagt.
      - name: Nach Chocolatey
        # #20. ANDERE REGEL ALS OBEN, mit Absicht: die forgejo-Registry ist
        # unsere eigene - dorthin zu veroeffentlichen ist die Pflicht dieses
        # Laufs, und ein fehlendes Token auf main ein Fehler.
        # push.chocolatey.org ist ein FREMDER, oeffentlicher Dienst mit
        # Moderation. Dorthin zu veroeffentlichen ist eine Entscheidung, die
        # jemand trifft, indem er CHOCO_API_KEY setzt - nicht die Pflicht
        # eines woechentlichen Laufs. Ohne Schluessel wird hier gebaut und
        # NICHT eingereicht, und das ist kein Fehler, sondern der Normalfall.
        #
        # Es braucht kein choco.exe: push.chocolatey.org ist ein
        # NuGet-v2-Feed, und `choco push` ist darunter genau dieses PUT mit
        # X-NuGet-ApiKey. Ein zweites Paketsystem auf der Baumaschine waere
        # eine Zeile in deps.winget.json fuer nichts.
        #
        # NUR BEI EINEM LAUF VON HAND (seit 2026-09-23). Seit R2 unter
        # tools/ ersetzt statt liegen zu lassen, wuerde der woechentliche
        # Lauf sonst jeden Montag ein neues Paket in die Moderation
        # schieben und die Warteschlange zuruecksetzen. Der Kommentar oben
        # sagt seit jeher, das sei "eine Entscheidung, die jemand trifft" -
        # hier steht sie jetzt auch im Zweig, nicht nur in der Prosa.
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: pwsh
        env:
          CHOCO_API_KEY: ${{ secrets.CHOCO_API_KEY }}
        run: |
          $nupkg = Get-ChildItem dist\gappa-choco\*.nupkg | Select-Object -First 1
          if (-not $nupkg) { throw "kein Chocolatey-Paket in dist\gappa-choco" }
          # ERST DIE ZUSAGE PRUEFEN, DANN EINREICHEN (gemessen 2026-09-21).
          # VERIFICATION.txt im Paket schickt den Moderator auf das
          # oeffentliche Zip. Liegt dort ein anderer Bau - und das ist nach
          # jedem woechentlichen Lauf so, weil tools/ auf R2 unveraenderlich
          # ist und gappa.exe nicht reproduzierbar -, dann ist diese
          # Zusage falsch. Genau so ist zqel-gappa 1.4.0 am 21.09.
          # still ersetzt und vom Moderator zurueckgestellt worden. Niemand
          # hatte das entschieden; der Cron hat es getan.
          python tools\windows\dasselbe_wie_draussen.py --werkzeug gappa --dist dist\gappa
          $urteil = $LASTEXITCODE
          if ($urteil -eq 2) { throw "dasselbe_wie_draussen: nicht feststellbar" }
          if ($urteil -ne 0) {
            Write-Host "  $($nupkg.Name) wurde GEBAUT, nicht eingereicht - siehe oben."
            exit 0
          }
          if (-not $env:CHOCO_API_KEY) {
            Write-Host "CHOCO_API_KEY ist nicht gesetzt - $($nupkg.Name) wurde GEBAUT, nicht eingereicht."
            Write-Host "Oeffentlich zu veroeffentlichen ist eine Entscheidung; sie faellt durch das Setzen des Schluessels."
            exit 0
          }
          try {
            Invoke-WebRequest -Uri "https://push.chocolatey.org/api/v2/package" -Method Put `
              -Headers @{ "X-NuGet-ApiKey" = $env:CHOCO_API_KEY } `
              -Form @{ package = $nupkg } -UseBasicParsing | Out-Null
            Write-Output "  eingereicht:  $($nupkg.Name) - wann es sichtbar wird, entscheidet die Moderation"
          } catch {
            $code = $_.Exception.Response.StatusCode.value__
            if ($code -eq 409) {
              Write-Output "  unveraendert: $($nupkg.Name) (diese Version liegt dort schon)"
            } else {
              # Den KOERPER mitnehmen, nicht nur die Zahl. Am 2026-09-15
              # stand hier "HTTP 500" und sonst nichts; die Ursache
              # (fehlende OPC-Teile im Paket) liess sich nur durch Vergleich
              # mit einem echten Chocolatey-Paket finden. Eine Fehlermeldung,
              # die den Grund verschweigt, kostet eine Fahrt.
              $grund = $_.ErrorDetails.Message
              if ($grund) { Write-Output "  Antwort: $grund" }
              throw "Chocolatey-Upload $($nupkg.Name): HTTP $code"
            }
          }
